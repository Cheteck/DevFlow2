# MosaiX production stack: prebuilt image + postgres + redis.
#
#   MOSAIX_AUTH_JWT_SECRET=... MOSAIX_SESSION_SECRET=... docker compose -f compose.prod.yml up --build -d
#
# Prod invariants (RELEASE-READINESS P0/P1):
# - No bind-mount of the source tree (unlike compose.yml dev).
# - NODE_ENV/MOSAIX_ENV forced to production, demo mode forced off.
# - Secrets REQUIRED from shell env (never hardcoded, never committed).
# - DB/cache ports NOT published to the host.
# NOTE: runtime is still `pnpm start` (tsx) until the compiled-dist pipeline
# (P1 debt: scripts/build.ts is typecheck-only, tsconfig.build.json noEmit).
# Switching CMD to `node dist` before an emit pipeline exists would break boot.
name: mosaix-prod

services:
  platform:
    build: .
    image: mosaix-platform:prod
    command: ["pnpm", "start"]
    ports:
      - "${MOSAIX_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      MOSAIX_ENV: production
      MOSAIX_DEMO_USERS: "false"
      ALLOW_IN_MEMORY_IN_PRODUCTION: "false"
      MOSAIX_PORT: "${MOSAIX_PORT:-3000}"
      PORT: "${MOSAIX_PORT:-3000}"
      HOST: "0.0.0.0"
      MOSAIX_AUTH_JWT_SECRET: "${MOSAIX_AUTH_JWT_SECRET:?Set MOSAIX_AUTH_JWT_SECRET in env}"
      MOSAIX_SESSION_SECRET: "${MOSAIX_SESSION_SECRET:?Set MOSAIX_SESSION_SECRET in env}"
      MOSAIX_AUTH_TOKEN_TTL: "${MOSAIX_AUTH_TOKEN_TTL:-3600}"
      MOSAIX_DATABASE_URL: "${MOSAIX_DATABASE_URL:?Set MOSAIX_DATABASE_URL in env}"
      MOSAIX_REDIS_URL: "${MOSAIX_REDIS_URL:?Set MOSAIX_REDIS_URL in env}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in env}"
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env}"
      POSTGRES_DB: "${POSTGRES_DB:-mosaix}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:-mosaix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:
  redisdata:
