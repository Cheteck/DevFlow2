name: MosaiX CI & Architecture Enforcement

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Architecture Doctor
        run: pnpm mosaix doctor || true

      - name: Run Application Conformance Validation
        run: pnpm check:conformance

      - name: Full Verification Check (Build, Lint, Typecheck, Test, Format)
        run: pnpm check
